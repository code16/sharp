name: E2E Tests (playwright)
on:
  workflow_dispatch:
  push:
    branches:
      - 9.x
      - 10.x
  pull_request:
    branches:
      - 9.x
      - 10.x
jobs:
  e2e-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.5
          extensions: mbstring, dom, fileinfo, mysql
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Build assets
        run: npm run build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests-e2e
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        working-directory: tests-e2e
      - name: Install Composer dependencies
        run: composer install
        working-directory: tests-e2e/site
      - name: Create .env
        run: cp .env.e2e.ci .env
        working-directory: tests-e2e/site
      - name: Generate app key
        run: php artisan key:generate
        working-directory: tests-e2e/site
      - name: Setup DB
        run: |
          touch database/database.sqlite
          php artisan snapshot:load e2e-seed
        working-directory: tests-e2e/site
      - name: Run server
        run: php artisan serve --host=127.0.0.1 --port=8080 &
        working-directory: tests-e2e/site
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: tests-e2e
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: report
          path: |
            tests-e2e/playwright-report/
            tests-e2e/site/storage/logs/
          retention-days: 30
      - name: Notify Slack on failure
        uses: code16/.github/.github/actions/slack-notify-failure@main
        if: failure() && github.event_name == 'push'
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
